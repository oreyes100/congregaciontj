server {
    listen 80;
    client_max_body_size 32m;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Assets inmutables (content-hashed; Next ya envía immutable) ---
    location /_next/static/ {
        proxy_pass http://172.18.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- HTML/API de la app: no cachear (evita cache heurística de Safari) ---
    location / {
        proxy_pass http://172.18.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
    }
}
